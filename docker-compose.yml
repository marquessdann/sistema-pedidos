# Implantação simples: PostgreSQL + aplicação (API + frontend).
# Uso: crie o arquivo .env (veja .env.example) e rode: docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: della
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: della
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U della"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://della:${POSTGRES_PASSWORD}@db:5432/della?schema=public
      DIRECT_URL: postgresql://della:${POSTGRES_PASSWORD}@db:5432/della?schema=public
    ports:
      - "3333:3333"

volumes:
  pgdata:
