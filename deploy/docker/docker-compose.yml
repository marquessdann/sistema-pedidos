# Implantação simples: PostgreSQL + aplicação (API + frontend).
# Uso (alternativa ao Vercel): na raiz do projeto, crie o .env e rode:
#   docker compose -f deploy/docker/docker-compose.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: della
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: della
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U della"]
      interval: 5s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ../../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://della:${POSTGRES_PASSWORD}@db:5432/della?schema=public
      DIRECT_URL: postgresql://della:${POSTGRES_PASSWORD}@db:5432/della?schema=public
    ports:
      - "3333:3333"

volumes:
  pgdata:
